name: Verify DBunny

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.85.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile-tests
      - run: npm run compile
      - run: npm run test:unit
      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Extension Host tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:extension
      - run: npm audit --omit=dev
      - run: npm run package-extension -- --out dbunny.vsix
      - name: Test packaged runtime (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package -- dbunny.vsix
      - name: Test packaged runtime (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:package -- dbunny.vsix
      - name: Retain verified release package
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: dbunny-vsix
          path: dbunny.vsix
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile-tests
      - run: docker compose -p dbunny-ci up -d --wait --wait-timeout 180
      - name: Wait for database readiness and run integration tests
        run: npm run test:integration
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: test-results/integration
          if-no-files-found: warn
      - if: always()
        run: docker compose -p dbunny-ci logs --no-color
      - if: always()
        run: docker compose -p dbunny-ci stop
